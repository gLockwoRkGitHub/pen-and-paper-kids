# Baut den Browser-Player und veröffentlicht ihn auf Cloudflare Pages (geschützt durch Cloudflare Access).
# Anleitung zum Einrichten: docs/anleitung-cloudflare.md
#
# Läuft jede Nacht einmal (nur wenn sich seit dem letzten Lauf etwas geändert hat) und jederzeit von Hand über
# GitHub → Actions → „Spiel veröffentlichen“ → „Run workflow“.
# Bewusst nicht bei jedem Push: Story-Chat und Heim-PC pushen oft, das würde die freien Actions-Minuten aufbrauchen.
#
# Braucht im Repo (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variable:  FREIGABE = ja      (erst setzen, wenn der Zugangsschutz in Cloudflare steht!)
#   Variable:  CF_PROJEKT         (optional, Standard: der-weg-hinaus)
name: Spiel veröffentlichen

on:
  schedule:
    - cron: '23 2 * * *'     # jede Nacht ca. 4:23 Uhr deutscher Zeit
  workflow_dispatch:

concurrency:
  group: veroeffentlichen
  cancel-in-progress: true

env:
  PROJEKT: ${{ vars.CF_PROJEKT || 'der-weg-hinaus' }}
  WRANGLER: wrangler@4.131.2

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Nachts nur bauen, wenn es in den letzten 25 Stunden einen Commit gab
      - name: Gibt es etwas Neues?
        id: neu
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$(git log --since='25 hours ago' --format=%h -1)" ]; then
            echo "Keine Änderung seit gestern – nichts zu tun." >> "$GITHUB_STEP_SUMMARY"
            echo "weiter=nein" >> "$GITHUB_OUTPUT"
          else
            echo "weiter=ja" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.neu.outputs.weiter == 'ja'
        name: Pakete installieren
        run: npm ci

      - if: steps.neu.outputs.weiter == 'ja'
        name: Story prüfen
        run: npm test

      - if: steps.neu.outputs.weiter == 'ja'
        name: Player bauen (Story kompilieren, Bilder umwandeln)
        run: npm run player:bauen

      - if: steps.neu.outputs.weiter == 'ja'
        name: Ist Cloudflare eingerichtet?
        id: pruefen
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KONTO: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$KONTO" ]; then
            echo "Cloudflare-Secrets fehlen noch – nur gebaut, nichts veröffentlicht. Siehe docs/anleitung-cloudflare.md" >> "$GITHUB_STEP_SUMMARY"
            echo "bereit=nein" >> "$GITHUB_OUTPUT"
          else
            echo "bereit=ja" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.neu.outputs.weiter == 'ja' && steps.pruefen.outputs.bereit == 'ja'
        name: Cloudflare-Projekt anlegen (falls es noch keins gibt)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes "$WRANGLER" pages project list | grep -q " $PROJEKT "; then
            echo "Projekt $PROJEKT gibt es schon."
          else
            npx --yes "$WRANGLER" pages project create "$PROJEKT" --production-branch=main
            echo "Projekt **$PROJEKT** angelegt. Jetzt in Cloudflare den Zugangsschutz einrichten und danach die Variable FREIGABE=ja setzen." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.neu.outputs.weiter == 'ja' && steps.pruefen.outputs.bereit == 'ja' && vars.FREIGABE == 'ja'
        name: Veröffentlichen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "$WRANGLER" pages deploy player/dist --project-name="$PROJEKT" --branch=main --commit-dirty=true
          echo "Veröffentlicht (nur mit Anmeldung). Adresse: siehe Cloudflare → Workers & Pages → $PROJEKT, meist https://$PROJEKT.pages.dev" >> "$GITHUB_STEP_SUMMARY"

      - if: steps.neu.outputs.weiter == 'ja' && steps.pruefen.outputs.bereit == 'ja' && vars.FREIGABE != 'ja'
        name: Hinweis, wenn noch nicht freigegeben
        run: echo "Noch nicht veröffentlicht – Variable FREIGABE=ja fehlt (erst nach dem Zugangsschutz setzen)." >> "$GITHUB_STEP_SUMMARY"
